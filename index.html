<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0E1013;overflow:auto}
button,input,select{font-family:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid #7FD1E8;outline-offset:2px}
::-webkit-scrollbar{width:12px}
::-webkit-scrollbar-thumb{background:#2A2D34;border-radius:999px;border:3px solid #0E1013}
::-webkit-scrollbar-track{background:transparent}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.gold{background:linear-gradient(90deg,#F7D354,#E3A62A);-webkit-background-clip:text;background-clip:text;color:transparent}
.goldbg{background:linear-gradient(135deg,#F7D354,#E3A62A)}
.grp{font-size:12px;font-weight:800;letter-spacing:.08em;color:#6E737B;padding:18px 20px 8px}
.nav{display:flex;align-items:center;gap:12px;height:44px;padding:0 16px 0 20px;border:0;border-left:3px solid transparent;border-radius:0 10px 10px 0;background:transparent;color:#A3A8B0;font-size:15px;font-weight:700;width:100%;text-align:left}
.nav:hover{background:#1A1C21;color:#FFFFFF}
.nav.on{background:#1F2733;color:#FFFFFF;border-left-color:#7FD1E8}
.new{margin-left:auto;background:#E5534B;color:#FFFFFF;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.04em}
.pro{background:linear-gradient(135deg,#F7D354,#E3A62A);color:#0E1013;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}
.tlink{background:none;border:0;color:#A3A8B0;font-size:15px;font-weight:700;padding:8px 4px;display:inline-flex;align-items:center;gap:8px}
.tlink:hover{color:#FFFFFF}
.search{display:flex;align-items:center;gap:10px;height:44px;width:300px;padding:0 16px;border-radius:999px;background:#1A1C21;border:1px solid #2A2D34;color:#6E737B}
.search:focus-within{border-color:#3A3E46}
.search input{background:transparent;border:0;outline:0;color:#FFFFFF;font-size:14px;flex-grow:1;min-width:0}
.search input::placeholder{color:#6E737B}
.btn{height:44px;padding:0 22px;border-radius:999px;font-size:15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.bp{background:#E6E6E6;color:#0E1013;border:1px solid #E6E6E6}
.bp:hover{background:#FFFFFF;border-color:#FFFFFF}
.bp:disabled{background:#2A2D34;border-color:#2A2D34;color:#6E737B;cursor:not-allowed}
.bs{background:transparent;color:#FFFFFF;border:1px solid #3A3E46}
.bs:hover{border-color:#6E737B;background:#1A1C21}
.bs:disabled{color:#6E737B;border-color:#2A2D34;cursor:not-allowed}
.sm{height:38px;padding:0 16px;font-size:14px}
.ghost{background:none;border:0;color:#E9B83A;font-weight:800;font-size:14px;padding:6px 0;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.ghost:hover{color:#F7D354;text-decoration:underline}
.ghost:disabled{color:#6E737B;text-decoration:none;cursor:not-allowed}
.card{background:#1A1C21;border:1px solid #2A2D34;border-radius:16px}
.hov{transition:border-color .15s,background .15s}
.hov:hover{border-color:#3A3E46}
.nodata{opacity:.5}
.pick{background:#1A1C21;border:1px solid #2A2D34;border-radius:16px;color:#FFFFFF;text-align:left;transition:border-color .15s,background .15s,opacity .15s}
.pick:hover{border-color:#3A3E46;background:#1D2025}
.pick.sel{border-color:#E9B83A;box-shadow:inset 0 0 0 1px #E9B83A;background:#1E1C17}
.pick:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.itile{width:48px;height:48px;border-radius:14px;background:#22252B;color:#E9B83A;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pick.sel .itile{background:#2A2618}
.cb{width:22px;height:22px;border-radius:6px;border:1.5px solid #4A4E57;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cb.on{background:linear-gradient(135deg,#F7D354,#E3A62A);border-color:transparent}
.radio{width:22px;height:22px;border-radius:999px;border:1.5px solid #4A4E57;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.radio.on{border-color:#E9B83A}
.radio.on::after{content:'';width:10px;height:10px;border-radius:999px;background:#E9B83A}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid #2A2D34;background:#1A1C21;color:#A3A8B0;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:border-color .15s,color .15s}
.chip:hover{border-color:#3A3E46;color:#FFFFFF}
.chip.on{background:#2A2618;border-color:#E9B83A;color:#F7D354}
.chip:disabled{opacity:.4;cursor:not-allowed}
.ccount{font-size:12px;opacity:.75}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:#22252B;color:#A3A8B0;font-size:13px;font-weight:700;white-space:nowrap}
.tag.new{margin-left:0;background:#2A2618;color:#F7D354}
.qbadge{height:28px;min-width:40px;padding:0 10px;border-radius:8px;background:#22252B;color:#F7D354;font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.opt{width:100%;min-height:64px;display:flex;align-items:center;gap:16px;padding:14px 20px;border-radius:14px;border:1px solid #2A2D34;background:#1A1C21;color:#FFFFFF;font-size:16px;font-weight:600;text-align:left;transition:border-color .15s,background .15s}
.opt:hover{border-color:#3A3E46;background:#1D2025}
.opt.sel{border-color:#E9B83A;box-shadow:inset 0 0 0 1px #E9B83A;background:#1E1C17}
.opt.locked{cursor:default}
.opt.locked:hover{background:#1A1C21;border-color:#2A2D34}
.opt.ok,.opt.ok:hover{background:rgba(61,191,122,.12);border-color:#3DBF7A;box-shadow:inset 0 0 0 1px #3DBF7A}
.opt.bad,.opt.bad:hover{background:rgba(229,83,75,.12);border-color:#E5534B;box-shadow:inset 0 0 0 1px #E5534B}
.opt.okline,.opt.okline:hover{border-color:#3DBF7A;box-shadow:inset 0 0 0 1px #3DBF7A}
.opt.dim{opacity:.55}
.num{width:32px;height:32px;border-radius:999px;background:#22252B;color:#A3A8B0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.res{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.res.ok{background:#3DBF7A;color:#0E1013}
.res.bad{background:#E5534B;color:#FFFFFF}
.pq{height:44px;border-radius:10px;border:1px solid #2A2D34;background:#1A1C21;color:#A3A8B0;font-weight:800;font-size:14px;transition:border-color .15s}
.pq:hover{border-color:#6E737B;color:#FFFFFF}
.pq.ok{background:#3DBF7A;border-color:#3DBF7A;color:#0E1013}
.pq.bad{background:#E5534B;border-color:#E5534B;color:#FFFFFF}
.pq.skip{background:#3A3E46;border-color:#3A3E46;color:#E6E6E6}
.pq.ans{background:linear-gradient(135deg,#F7D354,#E3A62A);border-color:transparent;color:#0E1013}
.pq.hollow{background:transparent;border:1.5px dashed #6E737B;color:#A3A8B0}
.pq.cur{box-shadow:0 0 0 2px #121417,0 0 0 4px #FFFFFF;color:#FFFFFF}
.pq.ok.cur,.pq.ans.cur{color:#0E1013}
.lg{width:16px;height:16px;border-radius:5px;border:1px solid #3A3E46;background:#1A1C21;flex-shrink:0}
.lg.ok{background:#3DBF7A;border-color:#3DBF7A}
.lg.bad{background:#E5534B;border-color:#E5534B}
.lg.skip{background:#3A3E46}
.lg.ans{background:#E9B83A;border-color:#E9B83A}
.lg.hollow{background:transparent;border:1.5px dashed #6E737B}
.lg.cur{background:transparent;border:2px solid #FFFFFF}
.step{background:none;border:0;padding:0;text-align:left;color:#6E737B;display:flex;flex-direction:column;gap:14px}
.step:disabled{cursor:default}
.snum{width:28px;height:28px;border-radius:999px;border:1.5px solid #3A3E46;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.sbar{height:3px;border-radius:999px;background:#2A2D34}
.step.active{color:#FFFFFF}
.step.active .snum{border-color:#E9B83A;color:#F7D354}
.step.active .sbar{background:linear-gradient(90deg,#F7D354,#E3A62A)}
.step.done{color:#A3A8B0}
.step.done .snum{background:#2A2618;border-color:#2A2618;color:#F7D354}
.step.done .sbar{background:#5A4A22}
.step.done:hover{color:#FFFFFF}
.demo{display:inline-flex;align-items:center;gap:4px;padding:4px;border:1px dashed #3A3E46;border-radius:12px}
.demolabel{font-size:11px;font-weight:800;letter-spacing:.08em;color:#6E737B;padding:0 8px;text-transform:uppercase}
.segb{height:30px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:#A3A8B0;font-size:13px;font-weight:700}
.segb:hover{color:#FFFFFF;background:#22252B}
.segb.on{background:#2A2D34;color:#FFFFFF}
.tipwrap{position:relative}
.tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:#E6E6E6;color:#0E1013;font-size:13px;font-weight:800;padding:8px 12px;border-radius:10px;white-space:nowrap;display:none;z-index:10}
.tipwrap:hover .tip{display:block}
.bar{height:8px;border-radius:999px;background:#2A2D34;overflow:hidden}
.fill{height:100%;border-radius:999px}
.hdot{width:8px;height:8px;border-radius:999px;border:0;background:#3A3E46;padding:0;transition:width .2s,background .2s}
.hdot:hover{background:#6E737B}
.hdot.on{width:28px;background:linear-gradient(90deg,#F7D354,#E3A62A)}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.1em;color:#F07A73}
.livedot{width:8px;height:8px;border-radius:999px;background:#E5534B}
.crumb{background:none;border:0;padding:0;color:#A3A8B0;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.crumb:hover{color:#FFFFFF;text-decoration:underline}
.acc{overflow:hidden;transition:border-color .15s}
.acc:hover{border-color:#3A3E46}
.acchead{width:100%;display:flex;align-items:flex-start;gap:16px;padding:20px 24px;background:none;border:0;color:#FFFFFF;text-align:left}
.qtext{white-space:pre-line;font-size:16px;line-height:1.55;font-weight:700}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.chev{transition:transform .2s;color:#6E737B;margin-top:4px}
.chev.up{transform:rotate(180deg);color:#FFFFFF}
.arow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:#15171B;font-size:15px;font-weight:600}
.adot{width:10px;height:10px;border-radius:999px;flex-shrink:0}
.alabel{color:#6E737B;font-size:13px;font-weight:800;width:120px;flex-shrink:0}
.solbox{background:#22252B;border:1px solid #2A2D34;border-radius:16px;padding:20px 24px;display:flex;flex-direction:column;gap:10px}
.soltext{margin:0;color:#D5D8DD;line-height:1.65;font-size:15px}
.note{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:#A3A8B0}
.note.ok{color:#3DBF7A}
.note.bad{color:#F07A73}
.st{height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:800;display:inline-flex;align-items:center}
.st.ok{background:rgba(61,191,122,.12);color:#3DBF7A}
.st.bad{background:rgba(229,83,75,.12);color:#F07A73}
.st.skip{background:#22252B;color:#A3A8B0}
.tab{height:40px;padding:0 16px;border-radius:999px;border:1px solid #2A2D34;background:transparent;color:#A3A8B0;font-weight:800;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.tab:hover{color:#FFFFFF;border-color:#3A3E46}
.tab.on{background:#E6E6E6;color:#0E1013;border-color:#E6E6E6}
.overlay{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(5,6,8,.72);display:flex;align-items:center;justify-content:center;z-index:80}
.modal{width:480px;background:#1A1C21;border:1px solid #2A2D34;border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.toast{position:absolute;z-index:90;display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:14px;background:#22252B;border:1px solid #3A3E46;color:#FFFFFF;font-weight:800;font-size:15px;box-shadow:0 12px 32px rgba(0,0,0,.45);animation:tin .25s ease-out}
.slide{animation:slide .28s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.freshpill{height:24px;padding:0 10px;border-radius:999px;border:1px solid #E9B83A;color:#F7D354;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.goldpill{height:32px;padding:0 14px;border-radius:999px;background:#2A2618;border:1px solid #6B5620;color:#F7D354;font-weight:800;font-size:13px;display:inline-flex;align-items:center}
.selwrap{position:relative;display:inline-flex;align-items:center}
.selwrap select{height:40px;background:#1A1C21;border:1px solid #2A2D34;border-radius:999px;color:#FFFFFF;padding:0 38px 0 16px;font-size:14px;font-weight:700;appearance:none;-webkit-appearance:none;cursor:pointer}
.selwrap select:hover{border-color:#3A3E46}
.selwrap svg{position:absolute;right:14px;pointer-events:none;color:#A3A8B0}
.numin{width:120px;height:44px;background:#0E1013;border:1px solid #3A3E46;border-radius:12px;color:#FFFFFF;font-size:16px;font-weight:700;padding:0 14px}
.numin:focus{outline:2px solid #E9B83A;outline-offset:1px}
.jbtn{height:36px;padding:0 14px;border-radius:999px;border:1px dashed #6E737B;background:#121417;color:#A3A8B0;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.jbtn:hover{color:#FFFFFF;border-color:#A3A8B0}
.jpanel{position:absolute;bottom:46px;width:310px;max-height:640px;overflow-y:auto;background:#1A1C21;border:1px solid #3A3E46;border-radius:16px;padding:10px;box-shadow:0 20px 48px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:2px}
.jitem{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#D5D8DD;font-size:13px;font-weight:700;text-align:left}
.jitem:hover{background:#22252B}
.jitem.on{background:#2A2618;color:#F7D354}
.jcode{width:34px;font-weight:800;color:#6E737B;font-size:12px;flex-shrink:0}
.tcard{display:flex;align-items:center;gap:18px;padding:20px;text-align:left;color:#FFFFFF}
.tcard:hover{border-color:#3A3E46}
.cardbtn{flex-grow:1;display:flex;align-items:center;gap:16px;background:none;border:0;color:#FFFFFF;text-align:left;padding:0;min-width:0}
.cardbtn:disabled{cursor:default}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
</head>

<div style="display: flex; flex-wrap: wrap; gap: 12px 18px; padding-top: 16px; border-top: 1px solid #2A2D34;">
<sc-for list="{{E.legend}}" as="l" hint-placeholder-count="4">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #A3A8B0; font-weight: 700;"><span class="lg {{l.cls}}"></span>{{l.label}}</span>
</sc-for>
</div>
</aside>
</div>
</div>
</sc-if>

<sc-if value="{{examModal}}" hint-placeholder-val="{{false}}">
<div class="overlay">
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="exm-title">
<h2 id="exm-title" style="margin: 0; font-size: 22px; font-weight: 800;">Submit quiz?</h2>
<p style="margin: 0; color: #A3A8B0; font-size: 16px; line-height: 1.5;">{{examModalText}}</p>
<div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px;">
<button class="btn bs" onClick="{{examReview}}">Review</button>
<button class="btn bp" onClick="{{examSubmitNow}}">Submit</button>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{setModal}}" hint-placeholder-val="{{false}}">
<div class="overlay">
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="set-title">
<h2 id="set-title" style="margin: 0; font-size: 22px; font-weight: 800;">Clear all responses?</h2>
<p style="margin: 0; color: #A3A8B0; font-size: 16px; line-height: 1.5;">This empties your Mistake Notebook ({{setCount}} questions) and resets your quiz history. You'll start with a fresh notebook.</p>
<div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px;">
<button class="btn bs" onClick="{{setCancel}}">Cancel</button>
<button class="btn bp" onClick="{{setConfirm}}" style="background: #E5534B; border-color: #E5534B; color: #FFFFFF;">Clear everything</button>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{mqModal}}" hint-placeholder-val="{{false}}">
<div class="overlay">
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mqm-title">
<h2 id="mqm-title" style="margin: 0; font-size: 22px; font-weight: 800;">Exit Mistake Quiz?</h2>
<p style="margin: 0; color: #A3A8B0; font-size: 16px; line-height: 1.5;">{{mqModalText}}</p>
<div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px;">
<button class="btn bs" onClick="{{mqExitNow}}">Exit</button>
<button class="btn bp" onClick="{{mqKeep}}">Keep going</button>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{toastTR}}" hint-placeholder-val="{{false}}">
<div class="toast" role="status" style="top: 96px; right: 32px;">
<span class="itile" style="width: 32px; height: 32px; border-radius: 10px;"><svg class="ic" viewBox="0 0 24 24" width="18" height="18"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11M9 8h6"></path></svg></span>
{{toastText}}
</div>
</sc-if>
<sc-if value="{{toastBC}}" hint-placeholder-val="{{false}}">
<div class="toast" role="status" style="bottom: 104px; left: calc((100% - 320px) / 2); transform: translateX(-50%); border-color: #3DBF7A;">
<span class="res ok" style="width: 24px; height: 24px;"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" style="stroke-width: 3;"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
{{toastText}}
</div>
</sc-if>



</div>
</template>
<script src="app.js"></script>
</body>
</html>
